<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKHANANI Maths Lit App - Vukona Press</title>
<style>
body{font-family:Arial;background:#f4f6f9;margin:0;padding:0}
header{background:#0b2e5b;color:white;padding:15px;text-align:center}
.card{background:white;margin:15px;padding:15px;border-radius:10px;box-shadow:0 2px 5px #ccc}
button{background:#0b2e5b;color:white;border:none;padding:10px 15px;border-radius:5px;margin:5px;cursor:pointer}
input{padding:8px;width:90%;margin:5px 0}
h3{color:#0b2e5b}
</style>
</head>
<body>
<header>
<h2>MAKHANANI Maths Lit App</h2>
<p>Vukona Press - Offline Ready v1.3</p>
</header>

<div class="card">
<h3>Finance: VAT & Price</h3>
<input id="price" type="number" placeholder="Price ex: 965">
<button onclick="calcVAT()">Calculate VAT (15%)</button>
<p id="vatOut"></p>
</div>

<div class="card">
<h3>Marks: Mean Calculator</h3>
<input id="marks" placeholder="e.g. 45,67,51,52">
<button onclick="calcMean()">Calculate Mean</button>
<p id="meanOut"></p>
</div>

<div class="card">
<h3>Measurement: Area</h3>
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<button onclick="calcArea()">Calculate Area</button>
<p id="areaOut"></p>
</div>

<div class="card">
<p><b>Author:</b> Vusichauke Vukona Press | Student</p>
<p>App works offline - for WhatsApp sharing</p>
<a href="health/">Go to Health Monitor App →</a>
</div>

<script>
function calcVAT(){
let p=parseFloat(document.getElementById('price').value)||965;
let vat=p*0.15;
document.getElementById('vatOut').innerText=`Price: R${p} | VAT: R${vat.toFixed(2)} | Total: R${(p+vat).toFixed(2)}`;
}
function calcMean(){
let vals=document.getElementById('marks').value.split(',').map(Number);
let sum=vals.reduce((a,b)=>a+b,0);
let mean=sum/vals.length;
document.getElementById('meanOut').innerText=`Mean: ${mean.toFixed(1)} | Total: ${sum}`;
}
function calcArea(){
let l=parseFloat(document.getElementById('length').value);
let w=parseFloat(document.getElementById('width').value);
document.getElementById('areaOut').innerText=`Area: ${l*w} m²`;
}
// Disable old service worker
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}
</script>
</body>
</html>
